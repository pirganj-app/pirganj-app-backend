<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pirganj Admin</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main class="shell"><section id="loginCard" class="card login"><h1>Pirganj Admin</h1><p>নিরাপদে admin panel-এ প্রবেশ করুন</p><form id="loginForm"><input id="username" placeholder="Username" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Login</button><p id="loginError" class="error"></p></form></section>
<section id="panel" hidden><header class="top"><div><h1>Admin dashboard</h1><p>Activity, user security এবং messages</p></div><button id="logout" class="secondary">Logout</button></header><div id="message" class="toast" hidden></div>
<div class="grid"><section class="card"><h2>Custom message</h2><form id="messageForm"><input id="messageTitle" placeholder="শিরোনাম" required><textarea id="messageBody" placeholder="বার্তা" required></textarea><input id="messageUser" placeholder="নির্দিষ্ট User ID (খালি রাখলে সবাই)"><button>Send message</button></form></section><section class="card"><h2>User filter</h2><input id="userFilter" placeholder="নাম, email বা phone দিয়ে খুঁজুন"><div id="users" class="list"></div></section></div>
<section class="card"><div class="sectionHead"><h2>Activity log</h2><div><input id="activityUser" placeholder="User ID filter"><input id="activityAction" placeholder="Action filter"><button id="refresh">Refresh</button></div></div><div id="activity" class="tableWrap"></div></section></section></main><script src="/admin/admin.js"></script></body></html>
