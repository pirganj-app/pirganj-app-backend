<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pirganj Admin</title><link rel="stylesheet" href="/admin/admin.css"></head>
<body><main class="shell"><section id="loginCard" class="card login"><h1>Pirganj Admin</h1><p>নিরাপদে admin panel-এ প্রবেশ করুন</p><form id="loginForm"><input id="username" placeholder="Username" autocomplete="username" required><input id="password" type="password" placeholder="Password" autocomplete="current-password" required><button>Login</button><p id="loginError" class="error"></p></form></section>
<section id="panel" hidden><header class="top"><div><h1>Admin dashboard</h1><p>শুধু user visit ও login audit তথ্য</p></div><button id="logout" class="secondary">Logout</button></header><div id="message" class="toast" hidden></div>
<section class="card"><div class="sectionHead"><div><h2>User filter</h2><p>নাম, email অথবা phone দিয়ে user খুঁজুন</p></div><button id="clearFilters" class="secondary">Clear</button></div><div class="filters"><input id="nameFilter" placeholder="নাম"><input id="emailFilter" type="email" placeholder="ইমেইল"><input id="phoneFilter" placeholder="ফোন"></div><div id="users" class="list"></div></section>
<section class="card"><div class="sectionHead"><div><h2 id="activityTitle">Activity log</h2><p>শুধু page visit, login/logout, ভুল password attempt, সময় ও device IP</p></div><button id="refresh">Refresh</button></div><div id="activity" class="tableWrap"></div></section></section></main><script src="/admin/admin.js"></script></body></html>
